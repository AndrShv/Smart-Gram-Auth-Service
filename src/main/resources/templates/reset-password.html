<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля — SmartGram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
</head>
<body>
<div class="space-background"><div class="stars"></div><div class="stars2"></div></div>
<div class="aurora"><div class="aurora-blob"></div><div class="aurora-blob"></div></div>

<div class="card">
    <div class="logo">
        <svg width="30" height="30" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="16" stroke="url(#lg)" stroke-width="1.5" stroke-dasharray="4 3"/>
            <path d="M14 13c0-1.1.9-2 2-2h1.5c2.2 0 3.5 1.2 3.5 3s-1.3 3-3.5 3H15v4" stroke="url(#lg)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="26" cy="8" r="2.5" fill="#fb7185"/>
            <defs><linearGradient id="lg" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#c4b5fd"/><stop offset=".5" stop-color="#93c5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient></defs>
        </svg>
        <span class="logo-text">SmartGram</span>
    </div>

    <div class="icon-wrap">
        <div class="icon-ring"><i class="fas fa-key"></i></div>
    </div>

    <div class="page-title">Сброс пароля</div>
    <div class="page-sub">Введите код из письма и новый пароль</div>

    <div class="info-box">
        <i class="fas fa-envelope-open-text"></i>
        <span>Мы отправили 6-значный код на вашу почту. Проверьте папку "Спам".</span>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <form id="resetPasswordForm" th:action="@{/auth/reset-password}" method="post">
        <div class="form-group">
            <label for="token"><i class="fas fa-shield-alt"></i>Код подтверждения</label>
            <input type="text" id="token" name="token" placeholder="000000" maxlength="6" required autofocus inputmode="numeric">
            <div class="field-error" id="tokenError">Введите корректный код</div>
        </div>
        <div class="form-group">
            <label for="newPassword"><i class="fas fa-lock"></i>Новый пароль</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Минимум 6 символов" required>
            <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
            <div class="strength-text" id="strengthText"></div>
            <div class="field-error" id="passwordError">Минимум 6 символов</div>
        </div>
        <div class="form-group">
            <label for="confirmPassword"><i class="fas fa-lock"></i>Подтвердите пароль</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" required>
            <div class="field-error" id="confirmPasswordError">Пароли не совпадают</div>
        </div>
        <button type="submit" class="btn-primary">
            <i class="fas fa-check-circle"></i> Изменить пароль
        </button>
    </form>

    <div class="resend-row">
        <button type="button" id="resendBtn" class="resend-btn">
            <i class="fas fa-redo"></i> Отправить повторно
        </button>
        <div class="timer" id="timer"></div>
    </div>

    <div class="back-link">
        <a th:href="@{/auth/forgot-password}"><i class="fas fa-arrow-left"></i> Назад</a>
    </div>
</div>

<script>
    const pw = document.getElementById('newPassword');
    const fill = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    pw && pw.addEventListener('input', () => {
        const v = pw.value;
        let score = 0;
        if (v.length >= 6) score++;
        if (v.length >= 10) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;
        const labels = ['','Слабый','Слабый','Средний','Хороший','Сильный'];
        const colors = ['','#fb7185','#fb7185','#fbbf24','#a78bfa','#34d399'];
        fill.style.width = (score * 20) + '%';
        fill.style.background = colors[score] || '';
        text.textContent = score > 0 ? labels[score] : '';
        text.style.color = colors[score] || '';
    });
</script>
<script th:src="@{/js/reset-password.js}"></script>
</body>
</html>
