<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля - SmartGram</title>
    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<!-- Космический фон -->
<div class="space-background">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
    <div class="comets"></div>

    <!-- Планеты -->
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>
    <div class="planet planet-3"></div>
    <div class="planet planet-4"></div>

    <!-- Кольца планет -->
    <div class="planet-ring ring-1"></div>
    <div class="planet-ring ring-2"></div>
</div>

<div class="container">
    <div class="header">
        <!-- Космическая иконка ключа -->
        <div class="key-container">
            <div class="key-glow"></div>
            <div class="key-icon">
                <i class="fas fa-key"></i>
            </div>
            <div class="sparkles">
                <i class="fas fa-star sparkle sparkle-1"></i>
                <i class="fas fa-star sparkle sparkle-2"></i>
                <i class="fas fa-star sparkle sparkle-3"></i>
            </div>
        </div>
        <div class="title">Сброс пароля</div>
        <div class="subtitle">Введите код из письма и новый пароль</div>
        <div class="email-display" id="emailDisplay">
            <i class="fas fa-envelope"></i>
            <span id="emailText"></span>
        </div>
    </div>

    <div class="form-container">
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <div class="info-box">
            <i class="fas fa-envelope-open-text"></i>
            <span>Мы отправили 6-значный код на вашу почту. Проверьте папку "Спам", если не видите письмо.</span>
        </div>

        <!-- Форма -->
        <form id="resetPasswordForm" th:action="@{/auth/reset-password}" method="post">
            <div class="form-group">
                <label for="token">
                    <i class="fas fa-shield-alt"></i> Код подтверждения
                </label>
                <div class="input-wrapper">
                    <input type="text" id="token" name="token" placeholder="Введите 6-значный код" maxlength="6" required autofocus>
                    <div class="input-glow"></div>
                </div>
                <div class="error-message" id="tokenError">Введите корректный код</div>
            </div>

            <div class="form-group">
                <label for="newPassword">
                    <i class="fas fa-lock"></i> Новый пароль
                </label>
                <div class="input-wrapper">
                    <input type="password" id="newPassword" name="newPassword" placeholder="Минимум 6 символов" required>
                    <div class="input-glow"></div>
                </div>
                <div class="password-strength" id="passwordStrength">
                    <div class="password-strength-bar" id="passwordStrengthBar"></div>
                </div>
                <div class="password-strength-text" id="passwordStrengthText"></div>
                <div class="error-message" id="passwordError">Пароль должен содержать минимум 6 символов</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i> Подтвердите пароль
                </label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Повторите пароль" required>
                    <div class="input-glow"></div>
                </div>
                <div class="error-message" id="confirmPasswordError">Пароли не совпадают</div>
            </div>

            <button type="submit" class="btn btn-primary">
                    <span class="btn-text">
                        <i class="fas fa-check-circle"></i> Изменить пароль
                    </span>
                <span class="btn-glow"></span>
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner-orbit">
                <div class="spinner-planet"></div>
            </div>
        </div>

        <div class="resend-code">
            <button type="button" id="resendBtn" class="resend-button">
                <i class="fas fa-redo"></i> Отправить код повторно
            </button>
            <div class="timer" id="timer"></div>
        </div>

        <!-- Ссылка назад на forgot-password -->
        <div class="back-link">
            <a th:href="@{/auth/forgot-password}">
                <i class="fas fa-arrow-left"></i> Назад
            </a>
        </div>
    </div>
</div>

<script th:src="@{/js/reset-password.js}"></script>
</body>
</html>
