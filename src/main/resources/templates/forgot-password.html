<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля - SmartGram</title>
    <!-- CSS через Thymeleaf -->
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<!-- Космический фон -->
<div class="space-background">
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>
    <div class="comets"></div>

    <!-- Планеты -->
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>
    <div class="planet planet-3"></div>
    <div class="planet planet-4"></div>

    <!-- Кольца планет -->
    <div class="planet-ring ring-1"></div>
    <div class="planet-ring ring-2"></div>
</div>

<div class="container">
    <div class="header">
        <!-- Космическая иконка замка -->
        <div class="lock-container">
            <div class="lock-glow"></div>
            <div class="lock-icon">
                <i class="fas fa-lock"></i>
            </div>
            <div class="key-orbit">
                <i class="fas fa-key key-rotating"></i>
            </div>
        </div>
        <div class="title">Забыли пароль?</div>
        <div class="subtitle">Не беспокойтесь! Введите ваш email и мы отправим вам код для восстановления пароля</div>
    </div>

    <div class="form-container">
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <div class="info-box">
            <i class="fas fa-info-circle"></i>
            <span>Код восстановления будет действителен в течение 15 минут</span>
        </div>

        <!-- Форма -->
        <form id="forgotPasswordForm" th:action="@{/auth/forgot-password}" method="post">
            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email адрес
                </label>
                <div class="input-wrapper">
                    <input type="email" id="email" name="email" placeholder="example@email.com" required autofocus>
                    <div class="input-glow"></div>
                </div>
                <div class="error-message" id="emailError">Введите корректный email</div>
            </div>

            <button type="submit" class="btn btn-primary">
                    <span class="btn-text">
                        <i class="fas fa-paper-plane"></i> Отправить код
                    </span>
                <span class="btn-glow"></span>
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner-orbit">
                <div class="spinner-planet"></div>
            </div>
        </div>

        <!-- Ссылка на вход -->
        <div class="back-link">
            <a th:href="@{/auth/login}">
                <i class="fas fa-arrow-left"></i> Вернуться к входу
            </a>
        </div>
    </div>
</div>

<!-- JS через Thymeleaf -->
<script th:src="@{/js/forgot-password.js}"></script>

</body>
</html>
