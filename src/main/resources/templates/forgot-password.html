<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — SmartGram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
<div class="space-background"><div class="stars"></div><div class="stars2"></div></div>
<div class="aurora"><div class="aurora-blob"></div><div class="aurora-blob"></div></div>

<div class="card">
    <div class="logo">
        <svg width="30" height="30" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="16" stroke="url(#lg)" stroke-width="1.5" stroke-dasharray="4 3"/>
            <path d="M14 13c0-1.1.9-2 2-2h1.5c2.2 0 3.5 1.2 3.5 3s-1.3 3-3.5 3H15v4" stroke="url(#lg)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="26" cy="8" r="2.5" fill="#fb7185"/>
            <defs><linearGradient id="lg" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop stop-color="#c4b5fd"/><stop offset=".5" stop-color="#93c5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient></defs>
        </svg>
        <span class="logo-text">SmartGram</span>
    </div>

    <div class="icon-wrap">
        <div class="icon-ring"><i class="fas fa-lock"></i></div>
    </div>

    <div class="page-title">Забыли пароль?</div>
    <div class="page-sub">Введите ваш email и мы отправим код для восстановления</div>

    <div class="info-box">
        <i class="fas fa-info-circle"></i>
        <span>Код восстановления будет действителен в течение 1 минуты</span>
    </div>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <form id="forgotPasswordForm" th:action="@{/auth/forgot-password}" method="post">
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i>Email адрес</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required autofocus>
        </div>
        <button type="submit" class="btn-primary">
            <i class="fas fa-paper-plane"></i> Отправить код
        </button>
    </form>

    <div class="back-link">
        <a th:href="@{/auth/login}"><i class="fas fa-arrow-left"></i> Вернуться к входу</a>
    </div>
</div>
<script th:src="@{/js/forgot-password.js}"></script>
</body>
</html>
