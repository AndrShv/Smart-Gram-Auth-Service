<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | SmartGram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body>
<div class="space-background"><div class="stars"></div><div class="stars2"></div><div class="stars3"></div></div>
<div class="aurora"><div class="aurora-blob"></div><div class="aurora-blob"></div><div class="aurora-blob"></div></div>

<div class="content">
    <div class="astronaut-wrap">
        <span class="astronaut">🧑‍🚀</span>
        <div class="glow"></div>
    </div>

    <div class="error-code">404</div>
    <div class="error-title">Потерялись в космосе?</div>
    <div class="error-msg">
        Страница, которую вы ищете, не существует или была перемещена в другую галактику.
    </div>

    <div class="btns">
        <a th:href="@{/home}" class="btn btn-primary">
            <i class="fas fa-home"></i> На главную
        </a>
        <a th:href="@{/auth/login}" class="btn btn-secondary">
            <i class="fas fa-sign-in-alt"></i> Войти
        </a>
    </div>
</div>

<script>
    // генерируем летящие звёздочки
    const wrap = document.createElement('div');
    wrap.className = 'star-decor';
    for (let i = 0; i < 12; i++) {
        const s = document.createElement('span');
        const size = Math.random() * 2 + 1;
        s.style.cssText = `
            width:${size}px;height:${size}px;
            left:${Math.random()*100}vw;
            top:${80 + Math.random()*20}vh;
            animation-duration:${6+Math.random()*8}s;
            animation-delay:${Math.random()*6}s;
            opacity:0;
        `;
        wrap.appendChild(s);
    }
    document.body.appendChild(wrap);
</script>
</body>
</html>
