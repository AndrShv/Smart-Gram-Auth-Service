<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - SmartGram</title>
    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">📱 SmartGram</div>
        <div class="subtitle">Войдите в свой аккаунт</div>
    </div>

    <div class="form-container">
        <div class="alert alert-error" id="errorAlert"></div>

        <!-- Форма входа -->
        <form id="loginForm" th:action="@{/auth/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <div class="error-message" id="emailError">Введите корректный email</div>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                <div class="error-message" id="passwordError">Пароль должен содержать минимум 6 символов</div>
            </div>

            <div class="forgot-password">
                <a th:href="@{/auth/forgot-password}">Забыли пароль?</a>
            </div>

            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <!-- Загрузка -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <div class="divider">
            <span>или</span>
        </div>

        <!-- Вход через Google -->
        <a class="btn btn-google" href="/oauth2/authorization/google">
            <svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align: middle; margin-right: 8px;">
                <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
                <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
                <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
                <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
            </svg>
            Войти через Google
        </a>
        <!-- Ссылка на регистрацию -->
        <div class="register-link">
            Нет аккаунта? <a th:href="@{/auth/register}">Зарегистрируйтесь</a>
        </div>

    </div>
</div>

<!-- JS -->
<script th:src="@{/js/login.js}"></script>

</body>
</html>
