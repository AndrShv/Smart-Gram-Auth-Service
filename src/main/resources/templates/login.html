<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — SmartGram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="space-background">
    <div class="stars"></div><div class="stars2"></div><div class="stars3"></div>
</div>
<div class="aurora">
    <div class="aurora-blob"></div><div class="aurora-blob"></div>
</div>

<div class="card">
    <!-- Logo -->
    <div class="logo">
        <svg class="logo-mark" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="16" stroke="url(#lg)" stroke-width="1.5" stroke-dasharray="4 3"/>
            <circle cx="18" cy="18" r="8" fill="url(#lg2)" opacity=".25"/>
            <path d="M14 13c0-1.1.9-2 2-2h1.5c2.2 0 3.5 1.2 3.5 3s-1.3 3-3.5 3H15v4" stroke="url(#lg)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="26" cy="8" r="2.5" fill="#fb7185"/>
            <defs>
                <linearGradient id="lg" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#c4b5fd"/><stop offset=".5" stop-color="#93c5fd"/><stop offset="1" stop-color="#f9a8d4"/>
                </linearGradient>
                <linearGradient id="lg2" x1="10" y1="10" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/>
                </linearGradient>
            </defs>
        </svg>
        <span class="logo-text">SmartGram</span>
    </div>

    <div class="page-title">Добро пожаловать</div>
    <div class="page-sub">Войдите в свой аккаунт</div>

    <!-- Ошибка Thymeleaf param -->
    <div th:if="${param.error}" class="error-param-alert">
        <i class="fas fa-exclamation-circle"></i> Неверный email или пароль
    </div>

    <div class="alert alert-error" id="errorAlert"></div>

    <form id="loginForm" th:action="@{/auth/login}" method="post">
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i>Email</label>
            <div class="input-wrap">
                <input type="email" id="email" name="email" placeholder="example@email.com" required autocomplete="email">
            </div>
            <div class="field-error" id="emailError">Введите корректный email</div>
        </div>

        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i>Пароль</label>
            <div class="input-wrap">
                <input type="password" id="password" name="password" placeholder="Введите пароль" required autocomplete="current-password">
            </div>
            <div class="field-error" id="passwordError">Пароль должен содержать минимум 6 символов</div>
        </div>

        <div class="forgot">
            <a th:href="@{/auth/forgot-password}"><i class="fas fa-key"></i> Забыли пароль?</a>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Войти</button>
    </form>

    <div class="divider">или</div>

    <a class="btn-google" href="/oauth2/authorization/google">
        <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/>
            <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/>
            <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/>
            <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/>
        </svg>
        Войти через Google
    </a>

    <div class="register-link">
        Нет аккаунта? <a th:href="@{/auth/register}">Зарегистрируйтесь</a>
    </div>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
