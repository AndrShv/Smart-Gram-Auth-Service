about.hero.subtitle=Viajes Inolvidables por Más de 10 Años

# Story Section
about.story.title=Nuestra Historia
about.story.subtitle=Un Viaje de una Década
about.story.text1=TravelMax fue fundada en 2014 con una misión simple: hacer que viajar sea accesible, seguro e inolvidable para todos. A lo largo de los años, hemos organizado más de 50,000 viajes y ayudado a cientos de miles de personas a descubrir la belleza de nuestro mundo.
about.story.text2=Creemos que cada viaje debe ser especial. Por eso nuestro equipo profesional trabaja para crear itinerarios únicos, seleccionar cuidadosamente a nuestros socios y garantizar el más alto nivel de servicio en cada etapa de su viaje.
about.story.cta=Comience Su Viaje
about.story.highlight=Más de 10 Años de Experiencia
about.story.highlight.note=en la industria del turismo

# Why Choose Us Section
about.why_us.title=¿Por Qué Elegirnos?
about.why_us.subtitle=Ofrecemos Más que Solo Tours
about.feature.geo.title=Amplia Geografía
about.feature.geo.text=Más de 50 países y 200 ciudades en todo el mundo. Desde islas exóticas hasta capitales europeas.
about.feature.personal.title=Enfoque Personalizado
about.feature.personal.text=Cada tour se adapta a sus necesidades y preferencias individuales.
about.feature.safety.title=Seguridad y Protección
about.feature.safety.text=Seguro completo, socios verificados y soporte 24/7.
about.feature.support.title=Soporte 24/7
about.feature.support.text=Nuestro equipo está disponible para usted en cualquier momento, día o noche.

