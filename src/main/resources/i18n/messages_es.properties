# Mission & Vision
about.mission.title=Nuestra Misión
about.mission.text=Hacer que el mundo sea más accesible para cada viajero creando viajes seguros, cómodos e inolvidables que enriquezcan vidas y amplíen horizontes.
about.vision.title=Nuestra Visión
about.vision.text=Convertirnos en una empresa de viajes líder que conecta a las personas con sus sueños de viaje, ayudándoles a descubrir la belleza y diversidad de nuestro mundo.

