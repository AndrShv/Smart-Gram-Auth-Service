# FAQ Questions and Answers
contact.faq.q1=How do I book a tour?
contact.faq.a1=You can book a tour through our website, by phone, or at our office. A 30% deposit of the tour price is required for booking.
contact.faq.q2=What documents do I need for the trip?
contact.faq.a2=The required documents depend on the destination. Typically, a passport, visa (if required), and insurance are needed. Our manager will provide you with detailed information upon booking.
contact.faq.q3=Can I cancel or change a booking?
contact.faq.a3=Yes, changes and cancellations are possible according to the booking terms. The cancellation fee depends on the time remaining before departure and the specific tour conditions. Please ask our managers for details.
contact.faq.q4=Is insurance included in the tour price?
contact.faq.a4=Basic health insurance is included in all our tours. You can also purchase additional extended insurance covering luggage, cancellation, and other risks.
contact.faq.q5=Are there discounts for regular customers?
contact.faq.a5=Yes, we have a loyalty program. Regular customers receive discounts, prioritized service, and exclusive offers. We also offer discounts for groups and early bookings.


