contact.faq.title=Häufig gestellte Fragen
contact.faq.subtitle=Antworten auf die beliebtesten Fragen unserer Kunden

# FAQ Questions and Answers
contact.faq.q1=Wie buche ich eine Tour?
contact.faq.a1=Sie können eine Tour über unsere Website, telefonisch oder in unserem Büro buchen. Für die Buchung ist eine Anzahlung von 30% des Reisepreises erforderlich.
contact.faq.q2=Welche Dokumente benötige ich für die Reise?
contact.faq.a2=Die erforderlichen Dokumente hängen vom Reiseziel ab. In der Regel werden Reisepass, Visum (falls erforderlich), und Versicherung benötigt. Unser Manager wird Ihnen bei der Buchung detaillierte Informationen zukommen lassen.
contact.faq.q3=Kann ich eine Buchung stornieren oder ändern?
contact.faq.a3=Ja, Änderungen und Stornierungen sind gemäß den Buchungsbedingungen möglich. Die Stornogebühr hängt von der verbleibenden Zeit bis zur Abreise und den spezifischen Tourenbedingungen ab. Bitte fragen Sie unsere Manager nach Einzelheiten.
contact.faq.q4=Ist eine Versicherung im Reisepreis enthalten?
contact.faq.a4=Eine einfache Krankenversicherung ist in allen unseren Touren enthalten. Sie können auch eine zusätzliche erweiterte Versicherung abschließen, die Gepäck, Stornierung, und andere Risiken abdeckt.
contact.faq.q5=Gibt es Rabatte für Stammkunden?
contact.faq.a5=Ja, wir haben ein Treueprogramm. Stammkunden erhalten Rabatte, priorisierten Service und exklusive Angebote. Wir bieten auch Rabatte für Gruppen und Frühbucher an.


