# Story Section
about.story.title=Unsere Geschichte
about.story.subtitle=Eine jahrzehntelange Reise
about.story.text1=TravelMax wurde 2014 mit einer einfachen Mission gegründet: Reisen für jedermann zugänglich, sicher und unvergesslich zu machen. Im Laufe der Jahre haben wir über 50.000 Reisen organisiert und Hunderttausenden von Menschen geholfen, die Schönheit unserer Welt zu entdecken.
about.story.text2=Wir glauben, dass jede Reise etwas Besonderes sein sollte. Deshalb arbeitet unser professionelles Team daran, einzigartige Reiserouten zu erstellen, Partner sorgfältig auszuwählen und den höchsten Servicestandard in jeder Phase Ihrer Reise zu gewährleisten.
about.story.cta=Starten Sie Ihre Reise
about.story.highlight=Über 10 Jahre Erfahrung
about.story.highlight.note=in der Tourismusbranche

