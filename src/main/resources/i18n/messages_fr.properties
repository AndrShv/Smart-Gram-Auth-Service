contact.faq.title=Foire Aux Questions
contact.faq.subtitle=Réponses aux questions les plus populaires de nos clients

# FAQ Questions and Answers
contact.faq.q1=Comment réserver un tour?
contact.faq.a1=Vous pouvez réserver un tour via notre site web, par téléphone ou à notre bureau. Un acompte de 30% du prix du tour est requis pour la réservation.
contact.faq.q2=Quels documents sont nécessaires pour le voyage?
contact.faq.a2=Les documents requis dépendent de la destination. Généralement, un passeport, un visa (si nécessaire) et une assurance sont nécessaires. Notre manager vous fournira des informations détaillées lors de la réservation.
contact.faq.q3=Puis-je annuler ou modifier une réservation?
contact.faq.a3=Oui, les modifications et annulations sont possibles selon les conditions de réservation. Les frais d'annulation dépendent du temps restant avant le départ et des conditions spécifiques du tour. Veuillez demander des détails à nos managers.
contact.faq.q4=L'assurance est-elle incluse dans le prix du tour?
contact.faq.a4=L'assurance maladie de base est incluse dans tous nos tours. Vous pouvez également acheter une assurance étendue supplémentaire couvrant les bagages, l'annulation et d'autres risques.
contact.faq.q5=Y a-t-il des réductions pour les clients réguliers?
contact.faq.a5=Oui, nous avons un programme de fidélité. Les clients réguliers bénéficient de réductions, d'un service prioritaire et d'offres exclusives. Nous offrons également des réductions pour les groupes et les réservations anticipées.


