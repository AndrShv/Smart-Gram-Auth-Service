# Story Section
about.story.title=Notre Histoire
about.story.subtitle=Un Voyage d'une Décennie
about.story.text1=TravelMax a été fondée en 2014 avec une mission simple: rendre le voyage accessible, sûr et inoubliable pour tous. Au fil des ans, nous avons organisé plus de 50 000 voyages et aidé des centaines de milliers de personnes à découvrir la beauté de notre monde.
about.story.text2=Nous croyons que chaque voyage doit être spécial. C'est pourquoi notre équipe professionnelle travaille à créer des itinéraires uniques, à sélectionner soigneusement les partenaires et à garantir le plus haut niveau de service à chaque étape de votre voyage.
